<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Context Ferry overview</title><desc id="d">Agent events cross policy, selection and evidence gates into a verified replay capsule.</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#071a2b"/><stop offset="1" stop-color="#172554"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="320" rx="24" fill="url(#g)"/><text x="60" y="70" fill="#f8fafc" font-family="system-ui" font-size="40" font-weight="700">Context Ferry</text><text x="60" y="108" fill="#93c5fd" font-family="system-ui" font-size="18">Verifiable, token-bounded agent context migration</text><g font-family="system-ui" text-anchor="middle"><rect x="70" y="160" width="190" height="90" rx="16" fill="#0f766e"/><text x="165" y="198" fill="white" font-size="18">SESSION EVENTS</text><text x="165" y="225" fill="#ccfbf1" font-size="14">objective · decisions · tools</text><rect x="370" y="160" width="210" height="90" rx="16" fill="#1d4ed8"/><text x="475" y="193" fill="white" font-size="18">SELECT + BOUND</text><text x="475" y="220" fill="#dbeafe" font-size="14">RuVector · tiktoken</text><text x="475" y="239" fill="#dbeafe" font-size="14">conformal risk</text><rect x="690" y="160" width="190" height="90" rx="16" fill="#7c3aed"/><text x="785" y="198" fill="white" font-size="18">RVF CAPSULE</text><text x="785" y="225" fill="#ede9fe" font-size="14">sealed evidence</text><rect x="990" y="160" width="150" height="90" rx="16" fill="#b45309"/><text x="1065" y="198" fill="white" font-size="18">REPLAY</text><text x="1065" y="225" fill="#fef3c7" font-size="14">verified state</text></g><g stroke="#60a5fa" stroke-width="5" fill="none" filter="url(#glow)"><path d="M260 205H365"/><path d="M580 205H685"/><path d="M880 205H985"/></g><circle r="7" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite" path="M260 205H985"/></circle></svg>
