<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d"><title id="t">Context Ferry execution flow</title><desc id="d">Policy, token, recall, selection, risk, evidence, verification and replay stages.</desc><rect width="1200" height="430" rx="24" fill="#07111f"/><text x="55" y="58" fill="#f8fafc" font-family="system-ui" font-size="30" font-weight="700">One migration, eight enforced stages</text><g font-family="system-ui" text-anchor="middle" font-size="15"><g fill="#0f766e"><rect x="50" y="110" width="240" height="72" rx="14"/><rect x="350" y="110" width="240" height="72" rx="14"/></g><g fill="#1d4ed8"><rect x="650" y="110" width="240" height="72" rx="14"/><rect x="950" y="110" width="200" height="72" rx="14"/></g><g fill="#7c3aed"><rect x="50" y="260" width="240" height="72" rx="14"/><rect x="350" y="260" width="240" height="72" rx="14"/></g><g fill="#b45309"><rect x="650" y="260" width="240" height="72" rx="14"/><rect x="950" y="260" width="200" height="72" rx="14"/></g><g fill="white"><text x="170" y="142">1 · POLICY FILTER</text><text x="170" y="164">clearance before optimization</text><text x="470" y="142">2 · TOKEN MEASURE</text><text x="470" y="164">OpenAI tiktoken</text><text x="770" y="142">3 · ANALOGUE RECALL</text><text x="770" y="164">RuVector memory</text><text x="1050" y="142">4 · SELECT</text><text x="1050" y="164">diverse knapsack</text><text x="170" y="292">5 · RISK GATE</text><text x="170" y="314">conformal upper bound</text><text x="470" y="292">6 · SEAL</text><text x="470" y="314">RVF witness chain</text><text x="770" y="292">7 · VERIFY</text><text x="770" y="314">budget + evidence</text><text x="1050" y="292">8 · REPLAY</text><text x="1050" y="314">decision state</text></g></g><g stroke="#60a5fa" stroke-width="4" fill="none"><path d="M290 146H345M590 146H645M890 146H945M1050 182V220H170V255M290 296H345M590 296H645M890 296H945"/></g><circle r="6" fill="#f8fafc"><animateMotion dur="